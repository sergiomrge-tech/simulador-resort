name: Refinar quiosque — capturas reais e regressões
on:
  workflow_dispatch:
  push:
    branches: ['refine/**']
    paths: ['scripts/**', 'shaders/**', 'tests/**', 'tools/**', '.github/workflows/visual-refine.yml', 'project.godot', 'export_presets.cfg', 'installer/**']
permissions:
  contents: write
concurrency:
  group: resort-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Obter repositório (incluindo versão 1.0.0)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python com bpy (Blender)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências de renderização e instalador NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth nsis unzip zip libgl1-mesa-dri libglu1-mesa libxi6 libxrandr2 libxcursor1 libxinerama1 libasound2t64 libpulse0
          python -m pip install --upgrade pip
          python -m pip install 'bpy==4.5.14' pillow numpy

      - name: Instalar Godot 4.5.1 e templates oficiais
        env:
          GODOT_VERSION: 4.5.1
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/godot/engine.zip" "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot/engine.zip" -d "$RUNNER_TEMP/godot/"
          mv "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          "$RUNNER_TEMP/godot/godot" --version
          echo "GODOT=$RUNNER_TEMP/godot/godot" >> "$GITHUB_ENV"

      - name: Testar ciclo de vida e ownership sem assets
        run: |
          set -euo pipefail
          mkdir -p shots
          TEST_ROOT=$(mktemp -d)
          mkdir -p "$TEST_ROOT/tests/support" "$TEST_ROOT/scripts"
          printf 'config_version=5\n' > "$TEST_ROOT/project.godot"
          cp tests/lifecycle_regression.gd "$TEST_ROOT/tests/"
          cp tests/support/state_waiter.gd "$TEST_ROOT/tests/support/"
          cp scripts/people.gd "$TEST_ROOT/scripts/"
          timeout 30 "$GODOT" --headless --path "$TEST_ROOT" --script res://tests/lifecycle_regression.gd 2>&1 | tee shots/lifecycle-ci.log
          grep -qx 'LIFECYCLE_TEST PASS' shots/lifecycle-ci.log
          if grep -Ei 'SCRIPT ERROR|Lambda capture.*freed|inconsistent' shots/lifecycle-ci.log; then
            exit 1
          fi

      - name: Baixar CC0 e modelar todos os assets com Blender
        run: |
          set -euo pipefail
          # CDN Poly Haven pode responder 502/520 mesmo após 4 tentativas
          # internas. Reexecutar aproveita downloads completos e recupera
          # glTF cujas texturas/binários ficaram incompletos.
          succeeded=0
          for attempt in 1 2 3 4; do
            echo "=== Tentativa de assets $attempt/4 ===" | tee -a fetch-assets.log
            if python -u tools/fetch_assets.py 2>&1 | tee -a fetch-assets.log; then
              succeeded=1
              break
            fi
            sleep 15
          done
          if [ "$succeeded" != "1" ]; then
            echo "Assets CC0 incompletos após quatro tentativas"; exit 1
          fi
          for model in service_fridge service_fridge_door service_food_cabinet service_register dish_petiscos dish_tapioca dish_pastel dish_acai dish_moqueca dish_batida; do
            test -s "assets/models/gen/$model.glb"
          done
          for model in plate-dinner plate-deep utensil-spoon utensil-fork; do
            test -s "assets/models/kenney/$model.glb"
          done
          test -s assets/models/qnat/Bush_Common.gltf
          test -s assets/models/ubc/Superhero_Male_FullBody.gltf
          test -s assets/models/ubc/Superhero_Female_FullBody.gltf
          test -s assets/models/ubc/Hair_Buzzed.gltf
          test -s assets/models/ubc/T_Hair_1_Normal_png.png
          test -s assets/models/ubc/T_Hair_1_Normal.png
          for model in coconut_green coconut_open pineapple orange frappe cup_plastic glass_juice cocktail campfire_logs beach_flag beach_spade boat_hull; do
            test -s "assets/models/gen/${model}.glb"
          done

      - name: Importar assets, comprimir texturas e importar de novo
        run: |
          set -euo pipefail
          python tools/clean_orphan_imports.py
          timeout 2400 "$GODOT" --headless --path . --import 2>&1 | tee import-1.log
          python tools/vram_textures.py 2>&1 | tee vram.log
          timeout 2400 "$GODOT" --headless --path . --import 2>&1 | tee import-2.log
          python - <<'PY'
          import pathlib, re
          for stem in ('Superhero_Male_FullBody','Superhero_Female_FullBody','Hair_Buzzed'):
              cfg = pathlib.Path('assets/models/ubc') / (stem + '.gltf.import')
              txt = cfg.read_text(encoding='utf-8')
              match = re.search(r'^path="res://([^"]+)"', txt, re.M)
              assert match and pathlib.Path(match.group(1)).is_file(), f'Falha ao importar UBC: {stem}'
          print('UBC_IMPORTED PASS')
          PY

      - name: Testar assentos do quiosque e ciclo completo do jogo
        run: |
          set -euo pipefail
          mkdir -p shots
          timeout 240 "$GODOT" --headless --audio-driver Dummy --path . -- --loop-test --kiosk-test --quality=0 2>&1 | tee shots/kiosk-ci.log
          grep -q 'KIOSK_TEST PASS' shots/kiosk-ci.log
          timeout 180 "$GODOT" --headless --audio-driver Dummy --path . -- --loop-test --order-visual-test --quality=0 2>&1 | tee shots/orders-ci.log
          grep -qx 'ORDER_VISUAL_TEST PASS' shots/orders-ci.log
          # Após validação de ocupação/rotas, testar fluxo comercial (VIP/rush)
          # sem a distância inicial aleatória da praia interferir no relógio acelerado.
          timeout 380 "$GODOT" --headless --audio-driver Dummy --path . -- --loop-test --quality=0 2>&1 | tee shots/loop-ci.log
          grep -qx 'LOOP_TEST PASS.*' shots/loop-ci.log
          # Godot pode sair com código 0 mesmo após erro de script.
          if grep -Ei 'SCRIPT ERROR|ERROR:.*meta|REAL_MISSING|resource file not found|Lambda capture.*freed|inconsistent' shots/kiosk-ci.log shots/loop-ci.log shots/orders-ci.log; then
            echo "Falha: erro de script, referência liberada ou ownership inválido"; exit 1
          fi

      - name: Testar criação de empresa e operação física
        run: |
          set -euo pipefail
          timeout 240 "$GODOT" --headless --audio-driver Dummy --path . -- --loop-test --company-test --quality=0 2>&1 | tee shots/company-ci.log
          grep -qx 'COMPANY_TEST PASS' shots/company-ci.log
          if grep -Ei 'SCRIPT ERROR|ERROR:.*meta|REAL_MISSING|resource file not found|Lambda capture.*freed|inconsistent' shots/company-ci.log; then exit 1; fi

      - name: Tirar screenshots e procurar erros de recursos
        run: |
          set -euo pipefail
          timeout 600 xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT" --audio-driver Dummy --path . --rendering-driver opengl3 --rendering-method gl_compatibility -- --shot=ci-quiosque --cam=38,3,-2,0,-28,12 --v1 --noroof --quality=1 --primcheck --floatcheck --out="$PWD/shots/ci-quiosque.png" > shots/visual-ci.log 2>&1
          test -s shots/ci-quiosque.png
          if grep -Ei 'SCRIPT ERROR|ERROR:.*meta|REAL_MISSING|resource file not found' shots/visual-ci.log; then
            echo "Falha: recursos ou scripts ausentes"; exit 1
          fi

      - name: Capturar quiosque refinado de dia e à noite
        run: |
          set -euo pipefail
          for spec in 'frente:38,2.8,-3,0,-8,12' 'balcao:38,0.15,-8,0,-4,12' 'noite:38,2.8,-3,0,-8,20'; do
            NAME=${spec%%:*}
            CAMERA=${spec#*:}
            timeout 600 xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT" --audio-driver Dummy --path . --rendering-driver opengl3 --rendering-method gl_compatibility -- --shot="visual-$NAME" --cam="$CAMERA" --v1 --clean-shot --quality=1 --out="$PWD/shots/visual-$NAME.png" > "shots/visual-$NAME.log" 2>&1
            test -s "shots/visual-$NAME.png"
            if grep -Ei 'SCRIPT ERROR|ERROR:.*meta|REAL_MISSING|resource file not found|inconsistent' "shots/visual-$NAME.log"; then exit 1; fi
          done

      - name: Capturar pedidos reais no balcão e na mesa
        run: |
          set -euo pipefail
          for spec in 'pedidos-balcao:36.2,0.5,-10,-51,-31,12' 'pedidos-mesa:34.2,0.1,-9.6,152,-34,12' 'pedidos-mesa-b:43.2,0.1,-9.6,145,-34,12'; do
            NAME=${spec%%:*}
            CAMERA=${spec#*:}
            timeout 600 xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT" --audio-driver Dummy --path . --rendering-driver opengl3 --rendering-method gl_compatibility -- --shot="$NAME" --cam="$CAMERA" --v1 --orders-demo --clean-shot --quality=1 --out="$PWD/shots/$NAME.png" > "shots/$NAME.log" 2>&1
            test -s "shots/$NAME.png"
            if grep -Ei 'SCRIPT ERROR|ERROR:.*meta|REAL_MISSING|resource file not found|inconsistent' "shots/$NAME.log"; then exit 1; fi
          done

      - name: Capturar empresa e equipamentos no Godot
        run: |
          set -euo pipefail
          for spec in 'empresa-frente:38,2.8,-3,0,-8,12' 'empresa-geladeira:38,0.1,-20.5,180,-8,12' 'cel_empresa:38,0.1,-20.5,180,-8,12'; do
            NAME=${spec%%:*}
            CAMERA=${spec#*:}
            EXTRA=--clean-shot
            if [ "$NAME" = cel_empresa ]; then EXTRA=; fi
            timeout 600 xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT" --audio-driver Dummy --path . --rendering-driver opengl3 --rendering-method gl_compatibility -- --shot="$NAME" --cam="$CAMERA" --v1 --company-demo $EXTRA --quality=1 --out="$PWD/shots/$NAME.png" > "shots/$NAME.log" 2>&1
            test -s "shots/$NAME.png"
            if grep -Ei 'SCRIPT ERROR|ERROR:.*meta|REAL_MISSING|resource file not found|inconsistent' "shots/$NAME.log"; then exit 1; fi
          done

      - name: Guardar prévia visual antes da montagem
        uses: actions/upload-artifact@v4
        with:
          name: refinamento-visual-${{ github.sha }}
          path: shots/
          retention-days: 7

      - name: Exportar e testar instalador atualizado da empresa
        if: github.ref == 'refs/heads/refine/company-kiosk'
        env:
          STAGE: ${{ runner.temp }}/company-stage
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/company-templates" "$HOME/.local/share/godot/export_templates/4.5.1.stable" "$STAGE" build/win
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/company-templates/templates.tpz" 'https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz'
          unzip -q "$RUNNER_TEMP/company-templates/templates.tpz" 'templates/windows_release_x86_64.exe' -d "$RUNNER_TEMP/company-templates"
          cp "$RUNNER_TEMP/company-templates/templates/windows_release_x86_64.exe" "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          python tools/prune_export.py apply
          trap 'python tools/prune_export.py restore' EXIT
          timeout 2400 "$GODOT" --headless --path . --export-release 'Windows Desktop' "$PWD/build/win/MareAltaResort.exe" > shots/company-export.log 2>&1
          python tools/prune_export.py restore
          trap - EXIT
          test -s build/win/MareAltaResort.exe
          test -s build/win/MareAltaResort.pck
          timeout 240 "$GODOT" --headless --audio-driver Dummy --main-pack "$PWD/build/win/MareAltaResort.pck" -- --loop-test --company-test --quality=0 2>&1 | tee shots/company-pack-test.log
          grep -qx 'COMPANY_TEST PASS' shots/company-pack-test.log
          timeout 600 xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT" --audio-driver Dummy --main-pack "$PWD/build/win/MareAltaResort.pck" --rendering-driver opengl3 --rendering-method gl_compatibility -- --shot=empresa-full --cam=38,0.1,-20.5,180,-8,12 --v1 --company-demo --clean-shot --quality=1 --out="$PWD/shots/empresa-full.png" > shots/company-pack-visual.log 2>&1
          test -s shots/empresa-full.png
          if grep -Ei 'SCRIPT ERROR|ERROR:.*meta|REAL_MISSING|resource file not found|Lambda capture.*freed|inconsistent' shots/company-pack-test.log shots/company-pack-visual.log; then exit 1; fi
          cp build/win/MareAltaResort.exe build/win/MareAltaResort.pck "$STAGE/"
          cp installer/setup.nsi installer/Jogar.vbs installer/icon.ico installer/LEIA-ME.txt "$STAGE/"
          (cd "$STAGE" && makensis -V2 setup.nsi) 2>&1 | tee shots/company-installer.log
          test -s "$STAGE/Instalar_MareAltaResort_v1.1.0.exe"
          (cd "$STAGE" && sha256sum Instalar_MareAltaResort_v1.1.0.exe > SHA256SUMS.txt)

      - name: Guardar instalador 1.1.0 RC1
        if: github.ref == 'refs/heads/refine/company-kiosk'
        uses: actions/upload-artifact@v4
        with:
          name: instalador-empresa-110-rc1
          path: |
            ${{ runner.temp }}/company-stage/Instalar_MareAltaResort_v1.1.0.exe
            ${{ runner.temp }}/company-stage/SHA256SUMS.txt
          retention-days: 14

      - name: Publicar instalador de testes da empresa
        if: success() && github.ref == 'refs/heads/refine/company-kiosk'
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ runner.temp }}/company-stage
        run: |
          set -euo pipefail
          TAG=v1.1.0-rc1
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "A prévia já existe; instalador desta execução disponível no artefato."
            exit 0
          fi
          gh release create "$TAG" "$STAGE/Instalar_MareAltaResort_v1.1.0.exe" "$STAGE/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Maré Alta Resort 1.1.0 RC1 — sua empresa no quiosque' --prerelease --notes 'Crie sua marca com nome, fonte e cor. Geladeira com vidro, cozinha, armário de pratos, retirada e entrega por item, contas a receber, limpeza e quatro cargos com salários. Saves anteriores preservam o modo original até ativar a empresa. Testes nativos Godot e regressões do pacote exportado; capturas reais no Actions. Instalação, controles, transparência e desempenho no Windows ainda exigem verificação no aparelho. Faça backup de userdata antes de voltar para uma versão anterior.'

      - name: Guardar logs mesmo se a validação falhar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-refinamento-${{ github.sha }}
          path: |
            shots/
            import-*.log
            fetch-assets.log
          retention-days: 14
