; Texture streaming pool per texture quality (07/11: the demo showed "Video memory has been exhausted (331 MB over budget)"
; on an 8 GB card with the engine's default pool). Low keeps 4 GB cards safe; Epic/Cinematic use the room of 8 GB cards.
[TextureQuality@0]
r.Streaming.PoolSize=400

[TextureQuality@1]
r.Streaming.PoolSize=900

[TextureQuality@2]
r.Streaming.PoolSize=1800

[TextureQuality@3]
r.Streaming.PoolSize=2800

[TextureQuality@Cine]
r.Streaming.PoolSize=3200
