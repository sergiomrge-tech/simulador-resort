[SystemSettings]
; Keep Lumen lighting/reflections while avoiding the async GPU fault reproduced
; during the unlocked hotel startup on the target RTX 4060 Ti / driver 617.42.
r.Lumen.AsyncCompute=0
; Village street lamps cast shadows at night (Sergio, 03/11): up to ~13 overlap in a spot, over the default 16-per-pixel
; VSM one-pass limit once the hotel/kiosk lights add up ("One Pass Projection max lights overflow" in the EXE, 04/11).
r.Shadow.Virtual.OnePassProjection.MaxLightsPerPixel=32
; Occlusion (04/11, EXE): HZB occlusion made the render thread wait ~10 ms a frame in MapOcclusionResults (it flushes the
; RHI thread for the previous frame's readback), so the render thread and the GPU took turns. Per-primitive GPU queries
; read two frames late instead: beach 29 -> 33 FPS, kiosk 29 -> 36, village at night 40 -> 46 (bench_package.ps1).
r.HZBOcclusion=0
r.NumBufferedOcclusionQueries=2

[/Script/Engine.UserInterfaceSettings]
ApplicationScale=1.0
